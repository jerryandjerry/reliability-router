  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #66645f;
      --line: #d9d7ce;
      --accent: #2368b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10100f;
        --surface: #1b1b19;
        --ink: #f7f7f4;
        --muted: #aaa79d;
        --line: #33322f;
        --accent: #6aa6f8;
      }
    }
    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { width: 100%; max-width: 100%; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub, .note { color: var(--muted); font-size: 13px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 22px 0 16px; }
    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
    }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 650; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; }
    .rank { width: 1%; color: var(--muted); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    code { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  </style>
</head>

  <script>
    const metrics = [
      ["accuracy", "Accuracy", value => value.toFixed(4)],
      ["deep_f1", "DEEP F1", value => value.toFixed(4)],
      ["deep_precision", "DEEP precision", value => value.toFixed(4)],
      ["deep_recall", "DEEP recall", value => value.toFixed(4)],
      ["p50_latency_ms", "p50 latency", value => `${value.toFixed(3)} ms`],
      ["p95_latency_ms", "p95 latency", value => `${value.toFixed(3)} ms`],
    ];
    let entries = [];
    let sortKey = "accuracy";
    let sortDirection = 1;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function metricCell(entry, key, format) {
      const value = Number(entry[key]);
      if (!Number.isFinite(value)) return '<td class="num"></td>';
      return `<td class="num">${format(value)}</td>`;
    }

    function render() {
      const sorted = [...entries].sort((a, b) => {
        const left = Number(a[sortKey]);
        const right = Number(b[sortKey]);
        if (!Number.isFinite(left)) return 1;
        if (!Number.isFinite(right)) return -1;
        return sortDirection > 0 ? right - left : left - right;
      });
      document.querySelectorAll("button[data-key]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.key === sortKey));
      });
      if (!sorted.length) {
        document.getElementById("table").innerHTML = '<div class="empty">No runs recorded yet.</div>';
        return;
      }
      const rows = sorted.map((entry, index) => {
        const cells = metrics.map(([key, , format]) => metricCell(entry, key, format)).join("");
        return `<tr><td class="rank">${index + 1}</td>` +
          `<td>${escapeHtml(entry.name || "")}</td>` +
          `<td>${escapeHtml(entry.version || "")}</td>` +
          `${cells}</tr>`;
      }).join("");
      document.getElementById("table").innerHTML =
        '<table><thead><tr><th></th><th>Parser</th><th>Version</th>' +
        '<th class="num">Accuracy</th><th class="num">DEEP F1</th><th class="num">DEEP precision</th>' +
        '<th class="num">DEEP recall</th><th class="num">p50 latency</th>' +
        '<th class="num">p95 latency</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function embeddedEntries() {
      const element = document.getElementById("leaderboard-data");
      if (!element) return [];
      try {
        const data = JSON.parse(element.textContent || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function loadEmbedded() {
      entries = embeddedEntries();
      render();
    }

    document.querySelectorAll("button[data-key]").forEach(button => {
      button.addEventListener("click", () => {
        sortKey = button.dataset.key;
        sortDirection = Number(button.dataset.better);
        render();
      });
    });

    if (window.location.protocol === "file:") {
      loadEmbedded();
    } else {
      fetch("leaderboard.json", { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
          entries = Array.isArray(data) ? data : [];
          render();
        })
        .catch(loadEmbedded);
    }
  </script>
