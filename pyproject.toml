[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-router"
version = "1.0.0"
description = "Risk-aware QUICK/DEEP routing, evidence checks, and evaluation for LLM systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Reliability Router Contributors"}]
keywords = ["llm", "routing", "evaluation", "reliability", "rag", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
openai = ["openai>=2.41,<3"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
tfidf = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2"]
gbdt = [
  "optuna>=4.0,<5",
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
  "catboost>=1.2,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "sentence-transformers>=3.0,<6",
]
embedding = ["sentence-transformers>=3.0,<6", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "numpy>=1.26,<3"]
bert = [
  "accelerate>=1.2,<2",
  "sentencepiece>=0.2,<1",  # DebertaV2Tokenizer fails without it
  "torch>=2.2,<3",
  "transformers>=4.48,<5",
]
all = [
  "openai>=2.41,<3",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "streamlit>=1.40,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "sentence-transformers>=3.0,<6",
  "numpy>=1.26,<3",
  "accelerate>=1.2,<2",
  "torch>=2.2,<3",
  "transformers>=4.48,<5",
]

[project.scripts]
reliability-router = "reliability_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
